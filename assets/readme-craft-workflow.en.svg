<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">GitHub README Craft workflow</title>
  <desc id="desc">A four-step workflow: select languages, verify the repository, write the README, and check it before publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#172554" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="660" rx="34" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="96" y="108" fill="#172554" font-size="40" font-weight="700">GitHub README Craft</text>
    <text x="96" y="152" fill="#475569" font-size="23">From project evidence to a verified public README</text>
    <path d="M303 358H1129" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
    <g filter="url(#shadow)">
      <rect x="85" y="230" width="280" height="260" rx="22" fill="#fff"/><rect x="405" y="230" width="280" height="260" rx="22" fill="#fff"/><rect x="725" y="230" width="280" height="260" rx="22" fill="#fff"/><rect x="1045" y="230" width="280" height="260" rx="22" fill="#fff"/>
    </g>
    <g>
      <circle cx="130" cy="278" r="25" fill="#3730a3"/><text x="121" y="287" fill="#fff" font-size="21" font-weight="700">1</text><text x="170" y="284" fill="#172554" font-size="24" font-weight="700">Languages</text><text x="125" y="345" fill="#334155" font-size="18">Primary language</text><text x="125" y="384" fill="#334155" font-size="18">Optional variants</text><text x="125" y="443" fill="#64748b" font-size="18">Keep confirmed choices</text>
      <circle cx="450" cy="278" r="25" fill="#2563eb"/><text x="441" y="287" fill="#fff" font-size="21" font-weight="700">2</text><text x="490" y="284" fill="#172554" font-size="24" font-weight="700">Evidence</text><text x="445" y="345" fill="#334155" font-size="18">Code · configuration</text><text x="445" y="384" fill="#334155" font-size="18">Examples · commands</text><text x="445" y="443" fill="#64748b" font-size="18">Ground claims in evidence</text>
      <circle cx="770" cy="278" r="25" fill="#0f766e"/><text x="761" y="287" fill="#fff" font-size="21" font-weight="700">3</text><text x="810" y="284" fill="#172554" font-size="24" font-weight="700">Delivery</text><text x="765" y="345" fill="#334155" font-size="18">Overview · setup</text><text x="765" y="384" fill="#334155" font-size="18">Previews · documentation</text><text x="765" y="443" fill="#64748b" font-size="18">Guide the first-time reader</text>
      <circle cx="1090" cy="278" r="25" fill="#b45309"/><text x="1081" y="287" fill="#fff" font-size="21" font-weight="700">4</text><text x="1130" y="284" fill="#172554" font-size="24" font-weight="700">Release</text><text x="1085" y="345" fill="#334155" font-size="18">Links · assets</text><text x="1085" y="384" fill="#334155" font-size="18">Privacy · rendering</text><text x="1085" y="443" fill="#64748b" font-size="18">Check before and after release</text>
    </g>
    <g fill="#6366f1"><path d="M374 348l17 10-17 10z"/><path d="M694 348l17 10-17 10z"/><path d="M1014 348l17 10-17 10z"/></g>
    <rect x="95" y="550" width="1250" height="1" fill="#cbd5e1"/><text x="96" y="598" fill="#475569" font-size="20">For new projects, README revisions, public demos and multilingual documentation</text>
  </g>
</svg>
